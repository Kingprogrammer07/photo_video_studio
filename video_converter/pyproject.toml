[project]
name = "video-converter"
version = "0.1.0"
description = "Desktop GUI video converter built on ffmpeg"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
video-converter = "video_converter.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
